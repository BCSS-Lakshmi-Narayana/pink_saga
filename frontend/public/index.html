    <style>
        /* Pink splash while the bundle loads */
        #initial-brand-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            background: radial-gradient(circle at 30% 20%, #EC4899 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, #BE185D 0%, transparent 45%),
                linear-gradient(135deg, #500724 0%, #9D174D 40%, #DB2777 75%, #EC4899 100%);
            color: #fff;
            font-family: 'Oswald', 'Inter', system-ui, sans-serif;
            letter-spacing: 0.18em;
            z-index: 99999;
        }

        #initial-brand-splash .ring {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 4px solid rgba(255, 231, 179, 0.35);
            border-top-color: #FFE7B3;
            animation: brandSplashSpin 0.9s linear infinite;
        }

        /* A six-letter wordmark carries a much larger size than the sentence
           it replaced. */
        #initial-brand-splash h1 {
            margin: 0;
            font-weight: 800;
            font-size: 34px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }

        /* The expanded name is long, so it gets tighter tracking and a width
           cap — at 0.3em it overflowed a phone viewport. */
        #initial-brand-splash p {
            margin: 0;
            max-width: 320px;
            padding: 0 16px;
            font-size: 10px;
            line-height: 1.7;
            opacity: 0.8;
            letter-spacing: 0.12em;
            text-align: center;
        }

        @keyframes brandSplashSpin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script>
        // Remove splash once React mounts content into #root
        (function () {
            var maxWait = 12000;
            var start = Date.now();
            var iv = setInterval(function () {
                var root = document.getElementById('root');
                if ((root && root.children.length > 0) || Date.now() - start > maxWait) {
                    var splash = document.getElementById('initial-brand-splash');
                    if (splash) {
                        splash.style.transition = 'opacity 0.45s ease';
                        splash.style.opacity = '0';
                        setTimeout(function () { splash && splash.remove(); }, 480);
                    }
                    clearInterval(iv);
                }
            }, 120);
        })();
    </script>
